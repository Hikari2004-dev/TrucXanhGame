<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Một lọ thuốc độc có hình đầu lâu, dấu cộng, và một hình lập phương"><defs>
 <radialGradient id="bg" cx="50%" cy="38%" r="80%"><stop offset="0" stop-color="#fffef5"/><stop offset="1" stop-color="#fff0d0"/></radialGradient>
 <linearGradient id="gold" x2="0" y2="1"><stop offset="0" stop-color="#ffe8a1"/><stop offset="1" stop-color="#f1b938"/></linearGradient>
 <linearGradient id="glass" x1="0" x2="1"><stop offset="0" stop-color="#9b7fd6"/><stop offset=".55" stop-color="#6a4bb3"/><stop offset="1" stop-color="#4a2f8a"/></linearGradient>
 <linearGradient id="potion" x2="0" y2="1"><stop offset="0" stop-color="#8ef05a"/><stop offset="1" stop-color="#2fa83a"/></linearGradient>
 <clipPath id="flask"><path d="M206 160 V196 Q118 228 118 312 Q118 412 230 412 Q342 412 342 312 Q342 228 254 196 V160 Z"/></clipPath>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="155%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#453474" flood-opacity=".17"/></filter>
 </defs>
 <rect width="800" height="500" rx="25" fill="url(#bg)"/>
 <ellipse cx="400" cy="470" rx="335" ry="22" fill="#ae8540" opacity=".12"/>
 <path d="M40 105 Q150 30 295 92" fill="none" stroke="#f6e4bd" stroke-width="5" opacity=".65"/>
 <path d="M508 73 Q647 12 759 127" fill="none" stroke="#f6e4bd" stroke-width="5" opacity=".5"/>

 <!-- lọ thuốc độc -->
 <ellipse cx="230" cy="428" rx="118" ry="16" fill="#453474" opacity=".14"/>
 <g filter="url(#shadow)">
  <path d="M206 160 V196 Q118 228 118 312 Q118 412 230 412 Q342 412 342 312 Q342 228 254 196 V160 Z" fill="url(#glass)"/>
  <g clip-path="url(#flask)">
   <path d="M100 290 Q150 272 200 290 T300 290 T380 290 V430 H100 Z" fill="url(#potion)"/>
   <circle cx="168" cy="350" r="9" fill="#d6ffb8" opacity=".75"/><circle cx="292" cy="372" r="6" fill="#d6ffb8" opacity=".75"/><circle cx="270" cy="318" r="5" fill="#d6ffb8" opacity=".7"/>
  </g>
  <path d="M206 160 V196 Q118 228 118 312 Q118 412 230 412 Q342 412 342 312 Q342 228 254 196 V160 Z" fill="none" stroke="#33215f" stroke-width="6" stroke-linejoin="round"/>
  <path d="M150 268 Q140 300 146 340" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".45"/>
  <rect x="196" y="146" width="68" height="18" rx="6" fill="#6a4bb3" stroke="#33215f" stroke-width="5"/>
  <path d="M203 96 H257 L252 148 H208 Z" fill="#c9884a" stroke="#7a4a24" stroke-width="5" stroke-linejoin="round"/>
  <path d="M214 110 H246 M214 126 H246" stroke="#a36a35" stroke-width="4" stroke-linecap="round"/>
  <!-- nhãn đầu lâu xương chéo -->
  <rect x="174" y="226" width="112" height="98" rx="16" fill="#fffaf0" stroke="#33215f" stroke-width="4"/>
  <g stroke="#2b2440" stroke-width="10" stroke-linecap="round"><path d="M196 304 L264 256 M196 256 L264 304"/></g>
  <g fill="#2b2440"><circle cx="192" cy="252" r="7"/><circle cx="200" cy="260" r="7"/><circle cx="268" cy="252" r="7"/><circle cx="260" cy="260" r="7"/><circle cx="192" cy="308" r="7"/><circle cx="200" cy="300" r="7"/><circle cx="268" cy="308" r="7"/><circle cx="260" cy="300" r="7"/></g>
  <path d="M230 240 Q258 240 258 266 Q258 280 248 286 V296 H212 V286 Q202 280 202 266 Q202 240 230 240 Z" fill="#fff" stroke="#2b2440" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="220" cy="266" r="7" fill="#2b2440"/><circle cx="240" cy="266" r="7" fill="#2b2440"/>
  <path d="M230 274 L225 282 H235 Z" fill="#2b2440"/>
  <path d="M222 289 V296 M230 289 V296 M238 289 V296" stroke="#2b2440" stroke-width="3"/>
 </g>
 <!-- khói độc -->
 <g fill="#8ef05a" opacity=".85"><circle cx="246" cy="74" r="12"/><circle cx="222" cy="52" r="9"/><circle cx="252" cy="34" r="7"/></g>

 <!-- dấu cộng -->
 <g filter="url(#shadow)"><path d="M400 214 V286 M364 250 H436" stroke="url(#gold)" stroke-width="26" stroke-linecap="round"/>
 <path d="M400 214 V286 M364 250 H436" stroke="#c98a1e" stroke-width="26" stroke-linecap="round" opacity=".18" transform="translate(0 4)"/></g>

 <!-- hình lập phương -->
 <ellipse cx="590" cy="428" rx="120" ry="16" fill="#453474" opacity=".14"/>
 <g filter="url(#shadow)" stroke-linejoin="round">
  <path d="M500 206 L570 136 H720 L650 206 Z" fill="#8bd9ff"/>
  <path d="M650 206 L720 136 V286 L650 356 Z" fill="#2477c9"/>
  <path d="M500 206 H650 V356 H500 Z" fill="#46a5ec" fill-opacity=".9"/>
  <g fill="none" stroke="#1b4f8a" stroke-width="4" stroke-dasharray="12 10" opacity=".75"><path d="M570 136 V286 H720 M570 286 L500 356"/></g>
  <g fill="none" stroke="#163f73" stroke-width="7"><path d="M500 206 H650 V356 H500 Z M500 206 L570 136 H720 L650 206 M720 136 V286 L650 356"/></g>
  <path d="M516 222 H600" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".45"/>
  <g fill="#163f73"><circle cx="500" cy="206" r="7"/><circle cx="650" cy="206" r="7"/><circle cx="500" cy="356" r="7"/><circle cx="650" cy="356" r="7"/><circle cx="570" cy="136" r="7"/><circle cx="720" cy="136" r="7"/><circle cx="720" cy="286" r="7"/></g>
 </g>
</svg>
